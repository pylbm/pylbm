version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  apt_packages:
    # mpi4py loads the system MPI library
    - libopenmpi-dev
    # nbsphinx converts the Markdown cells of the notebooks
    - pandoc
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      # pylbm and the docs group, in the environment that Read the Docs uses
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --no-default-groups --group docs

sphinx:
  configuration: doc/_source/conf.py
