# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # UCX fails to open the network device of the GitHub runners
  # (ud_verbs/mana_0) and Open MPI then aborts with MPI_ERR_OTHER.
  OMPI_MCA_pml: ob1
  OMPI_MCA_btl: self,tcp

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        mpi:
          - openmpi
          - msmpi
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - os: ubuntu-latest
            mpi: msmpi
          - os: macos-latest
            mpi: msmpi
          - os: windows-latest
            mpi: openmpi

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI (${{ matrix.mpi }})
        run: bash .github/workflows/mpi/install-${{ matrix.mpi }}.sh

      # the environment is cached for a week: it follows the new releases of
      # the dependencies without solving and downloading it at each run
      - name: Get the week of the year
        id: week
        shell: bash
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Install the conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/environment.yml
          environment-name: pylbm-env
          cache-environment: true
          cache-environment-key: environment-${{ steps.week.outputs.week }}
          init-shell: bash

      - name: Install pylbm
        shell: bash -el {0}
        run: |
          pip install .

      - name: Lint with flake8
        shell: bash -el {0}
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        shell: bash -el {0}
        run: |
          pylint --rcfile=.pylintrc --errors-only pylbm

      - name: Test with pytest
        shell: bash -el {0}
        run: |
          pytest --nbval-lax notebooks
          cd tests; pytest --mpl --h5diff -m "not gpu and not slow" --cov=pylbm --numprocesses=auto

  gpu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add pocl to the conda environment file
        run: |
          cp conda/environment.yml conda/environment-gpu.yml
          echo "  - pocl" >> conda/environment-gpu.yml
          echo "  - ocl-icd" >> conda/environment-gpu.yml

      - name: Get the week of the year
        id: week
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Install the conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/environment-gpu.yml
          environment-name: pylbm-env
          cache-environment: true
          cache-environment-key: environment-gpu-${{ steps.week.outputs.week }}
          init-shell: bash

      - name: Install pylbm[gpu]
        shell: bash -el {0}
        run: |
          pip install .[gpu]

      - name: Test GPU backend with pytest
        shell: bash -el {0}
        run: |
          echo "OpenCL ICD vendor files in this env:"
          ls -la "$CONDA_PREFIX/etc/OpenCL/vendors/" || echo "(directory not found)"
          export OCL_ICD_VENDORS="$CONDA_PREFIX/etc/OpenCL/vendors"
          cd tests; pytest -m gpu --numprocesses=auto
