# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # UCX fails to open the network device of the GitHub runners
  # (ud_verbs/mana_0) and Open MPI then aborts with MPI_ERR_OTHER.
  OMPI_MCA_pml: ob1
  OMPI_MCA_btl: self,tcp
  # uv run uses the environment made by the install step as it is
  UV_NO_SYNC: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        mpi:
          - openmpi
          - msmpi
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - os: ubuntu-latest
            mpi: msmpi
          - os: macos-latest
            mpi: msmpi
          - os: windows-latest
            mpi: openmpi

    steps:
      - uses: actions/checkout@v4

      - name: Install MPI (${{ matrix.mpi }})
        run: bash .github/workflows/mpi/install-${{ matrix.mpi }}.sh

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      # pylbm is installed as a package (not editable), with the dev group
      - name: Install pylbm and the development tools
        run: uv sync --no-editable

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        run: |
          uv run pylint --rcfile=.pylintrc --errors-only pylbm

      - name: Test with pytest
        run: |
          uv run pytest --nbval-lax notebooks
          cd tests; uv run pytest --mpl --h5diff -m "not gpu and not slow" --cov=pylbm --numprocesses=auto

  gpu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # the mpi4py package of PyPI loads the MPI library of the system
      - name: Install MPI (openmpi)
        run: bash .github/workflows/mpi/install-openmpi.sh

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      # pocl gives an OpenCL device on the CPU of the runner
      - name: Install pylbm[gpu] and pocl
        run: uv sync --no-editable --extra gpu --group opencl

      - name: Test GPU backend with pytest
        run: |
          cd tests; uv run pytest -m gpu --numprocesses=auto
